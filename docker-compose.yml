# Flood：经云吞网关打开的种子下载前端，经 torrent_client 能力连接 qBittorrent 插件。
services:
  flood:
    # 上游官方镜像（https://github.com/jesec/flood，Docker Hub jesec/flood），摘要按清单列表固定。
    image: docker.io/jesec/flood:4.16.4@sha256:72bdc95ff160e1f6b8ad72c171eff53f0bab8aa651389ca710ffff170278390a
    user: "${PUID}:${PGID}"
    environment:
      FLOOD_OPTION_RUNDIR: /data
      TZ: ${TZ}
      # torrent_client 能力：核心把 <能力>.wonton.internal 转发到用户选的下载器插件（qBittorrent Web API v2），
      # 免凭据。能力依赖的字段还没定稿，核心不会注入：留空时回退 flood 自带账号（sso: none）。
      WONTON_TORRENT_CLIENT_URL: "${WONTON_TORRENT_CLIENT_URL:-}"
    entrypoint:
      - /bin/sh
      - -c
      - if [ -n "$$WONTON_TORRENT_CLIENT_URL" ]; then export FLOOD_OPTION_AUTH=none FLOOD_OPTION_QBURL="$$WONTON_TORRENT_CLIENT_URL" FLOOD_OPTION_QBUSER= FLOOD_OPTION_QBPASS=; fi; exec /sbin/tini -- flood
    volumes:
      - ${WONTON_APP_DATA}/flood:/data
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # 根页面不需要应用会话；检查 Flood 已真正监听并能返回前端页面。
      # -Y off：busybox wget 不看 no_proxy，出口代理变量存在时也会被它劫持（规范“网络”一节）。
      test: ["CMD", "wget", "-q", "-Y", "off", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      start_interval: 1s

x-wonton:
  spec: "0.5"
  id: app.flood.flood
  version: 0.1.0
  kind: app
  title: { en: Flood }
  description:
    zh: 统一界面管理 BT 下载，连接家里的 qBittorrent
    en: A unified BitTorrent front end for the qBittorrent at home
  icon: icon.svg
  notices: [NOTICE]
  screenshots: [screenshots/torrents.png, screenshots/details.png, screenshots/add.png]
  author: { name: geraldpeng6, url: https://github.com/geraldpeng6 }
  homepage: https://flood.js.org
  # 应用（Flood）的许可证；插件包自己的许可证写在仓库的 LICENSE 里。
  license: GPL-3.0-only
  tags:
    zh: [下载, BT]
    en: [Downloads, BitTorrent]
  about:
    zh: |
      Flood 是一个现代的种子下载前端：添加磁力链接和种子，按进度、速度和标签整理任务，订阅 RSS 自动下载。

      它自己不下载，需要配合下载器使用。装好 qBittorrent 插件并在出网代理设置下方的能力里选它作下载器后，Flood 自动连接，打开即用、不用再登录一次。
    en: |
      Flood is a modern BitTorrent front end: add magnets and torrents, organize tasks by progress, speed and tags, and subscribe to RSS feeds for automatic downloads.

      It does not download by itself and needs a client. After installing the qBittorrent plugin and picking it as the torrent client in the capability settings, Flood connects automatically — open and use, no second login.
  release_notes:
    zh: "首版：连接 qBittorrent 插件（经 torrent_client 能力，免二次登录），自带账号登录作为过渡。"
    en: "First release: connects to the qBittorrent plugin via the torrent_client capability without a second login; own-account login as a fallback."
  webui:
    service: flood
    port: 3000
    # Flood 不支持 OIDC 和代登录请求头。有下载器连接时用上游自带的 auth=none（免登录）；没有时保留
    # 自带账号，第一次打开在应用里注册。网关挡在前面，只有主人打得开。
    sso: none
  # RSS 订阅和按 URL 添加种子要从服务器抓取外网地址。
  permissions: [network.egress]
  # 上游没写最低内存，按开发环境实测取整。
  requirements:
    arch: [amd64, arm64]
    memory: 256M
